# Memory layout of the demo on the Plus/4.
#
#   $0002-$00FF  zero page: all the demo's - the KERNAL never runs (the
#                ROM is out, the interrupt is the music's own); the
#                music's interrupt is copied into it (SYNTH)
#   $0800-$0FFF  the screen: colours ($0800), codes ($0C00)
#   $1001-       the program, the music's wave pages (page-aligned), the
#                variables (BSS, cleared at the start)
#   $F000-$F3FF  the ROM's characters, copied to RAM at the start

FEATURES {
    STARTADDRESS: default = $1001;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $00FE;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $E000 - __HEADER_LAST__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    STRINGS:  load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    SYNTH:    load = MAIN,     run = ZP, type = rw, define = yes;
    WAVES:    load = MAIN,     type = ro, align = $100;
    BSS:      load = MAIN,     type = bss, define = yes;
}
