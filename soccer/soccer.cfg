# Memory layout of the soccer game on the Plus/4.
#
#   $0002-$00FF  zero page: all the game's - the KERNAL never runs (the
#                ROM is out, the interrupt is the game's own)
#   $1001-$BFFF  the program
#   $C000-$C7FF  picture 0: colours ($C000), codes ($C400)
#   $C800-$CFFF  picture 0's characters
#   $D000-$D7FF  picture 1: colours, codes
#   $D800-$DFFF  picture 1's characters
#   $E000-$E1FF  each picture's cache: which code a ground character has
#                in it (engine.s)

FEATURES {
    STARTADDRESS: default = $1001;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $00FE;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $C000 - __HEADER_LAST__;
    HI:       file = "", define = yes, start = $E000,           size = $1000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    FONTDATA: load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    BSS:      load = MAIN,     type = bss, define = yes;
    HIBSS:    load = HI,       type = bss, define = yes, align = $100;
}
