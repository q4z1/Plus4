# Memory layout for Demon Attack on the Plus/4.
#
#   $0002-$001B  cc65's own zero page
#   $001C-$007F  zero page of the assembly engine and kernel
#   $0080-$00FF  the 128 bytes of RAM the 2600 game keeps its state in,
#                at the very addresses the original uses
#   $1001-$B7FF  program
#   $B800-$BFFF  the game-over page: colours, then codes (not in any segment)
#   $C000-$CFFF  two character sets, one per picture (not in any segment)
#   $D000-$DFFF  two colour and screen matrices, one per picture (ditto)
#   $E000-$F4FF  tables built at start-up
#   $F500-$FCFF  cc65's stack
#
# The game takes the machine over completely - the KERNAL is never called
# while it runs - so the zero page above $1B is free to use.

FEATURES {
    STARTADDRESS: default = $1001;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800;
    __HIMEM__:     type = weak, value = $FD00;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    ZPENG:    file = "", define = yes, start = $001C,           size = $0064;
    ZP2600:   file = "", define = yes, start = $0080,           size = $0080;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $B800 - __HEADER_LAST__;
    HIRAM:    file = "", define = yes, start = $E000,           size = __HIMEM__ - $E000 - __STACKSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    ENGZP:    load = ZPENG,    type = zp;
    RAM2600:  load = ZP2600,   type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    ONCE:     load = MAIN,     type = ro,  optional = yes;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = bss;
    BSS:      load = MAIN,     type = bss, define   = yes;
    HIBSS:    load = HIRAM,    type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
