# Memory layout for Demon Attack as a 32 KB cartridge, for the C16 (16 KB)
# as much as for the Plus/4.
#
# RAM - all of it below $4000:
#   $0002-$001B  cc65's own zero page
#   $001C-$007F  zero page of the assembly engine and kernel
#   $0080-$00FF  the 128 bytes of the 2600 game's RAM
#   $0100-$01FF  the 6502's stack
#   $0200-$03FF  cc65's stack
#   $0400-$05FF  64 characters out of the ROM (crt0_cart.s)
#   $0800-$17FF  two colour and screen matrices, one per picture
#   $1800-$27FF  two character sets, one per picture
#   $2800-$3FFF  data, the code that changes itself, variables
#
# ROM - the cartridge's two halves, C1 low at $8000 and C1 high at $C000,
# both switched in. $FC00-$FCFF is always the KERNAL's (its bank switching)
# and $FD00-$FF3F is I/O, so the image has a hole there; the vectors at the
# very top are the cartridge's own.

FEATURES {
    STARTADDRESS: default = $8000;
}
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0200;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002, size = $001A;
    ZPENG:    file = "", define = yes, start = $001C, size = $0064;
    ZP2600:   file = "", define = yes, start = $0080, size = $0080;
    RAM:      file = "", define = yes, start = $2800, size = $1800;
    ROM:      file = %O, define = yes, start = $8000, size = $7C00, fill = yes, fillval = $FF;
    HOLE:     file = %O,               start = $FC00, size = $0340, fill = yes, fillval = $FF;
    ROMTOP:   file = %O,               start = $FF40, size = $00BA, fill = yes, fillval = $FF;
    VECTORS:  file = %O,               start = $FFFA, size = $0006;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    ENGZP:    load = ZPENG,   type = zp;
    RAM2600:  load = ZP2600,  type = zp;
    STARTUP:  load = ROM,     type = ro;
    CODE:     load = ROM,     type = ro;
    RODATA:   load = ROM,     type = ro;
    TABLES:   load = ROM,     type = ro,  align = $100;
    DATA:     load = ROM, run = RAM, type = rw, define = yes;
    RAMCODE:  load = ROM, run = RAM, type = rw, define = yes;
    BSS:      load = RAM,     type = bss, define = yes;
    VECTORS:  load = VECTORS, type = ro;
}
