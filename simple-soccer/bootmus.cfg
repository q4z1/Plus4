# The loading screen's music: music.s assembled with BOOT, the disk's file
# "music" (build.sh), which the boot (boot.s) loads to $E100 and starts
# there. $E100-$E6FF is free while the boot runs and stays so till the
# title takes the song over: above the flags ($D480-$E06F), below the
# boot's characters ($E800); not cleared by the game's start. Its zero
# page is above the game's and the packer's ($D8-$DD, $FD-).

MEMORY {
    ZP:       file = "", start = $00F0, size = $000C;
    LOADADDR: file = %O, start = $E0FE, size = $0002;
    RAM:      file = %O, start = $E100, size = $0600;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    BMLOAD:   load = LOADADDR, type = ro;
    BMHEAD:   load = RAM,      type = ro;
    TITLE:    load = RAM,      type = rw;
    SYNTH:    load = RAM,      type = rw;
}
