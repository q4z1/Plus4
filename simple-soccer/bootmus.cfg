# The loading screen's music: music.s assembled with BOOT, the disk's file
# "music" (build.sh), which the boot (boot.s) loads to $E200 and starts
# there. $E200-$E6FF is free while the boot runs and stays so till the
# title takes the song over: above the flags ($D480-$E06F), below the
# boot's characters ($E800); not cleared by the game's start. Its zero
# page: m_ptr above the game's and the packer's ($D8-$DD, $FD-); its
# interrupt (SYNTH, copied there) at $30 - the game's, which nothing touches
# till the title has taken the song over (the game's start uses $02-$03,
# the boot $2D-$2E).

MEMORY {
    ZP:       file = "", start = $00F0, size = $000C;
    ZPSYNTH:  file = "", start = $0030, size = $0050, define = yes;
    LOADADDR: file = %O, start = $E1FE, size = $0002;
    RAM:      file = %O, start = $E200, size = $0500;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    BMLOAD:   load = LOADADDR, type = ro;
    BMHEAD:   load = RAM,      type = ro;
    TITLE:    load = RAM,      type = rw;
    SYNTH:    load = RAM,      run = ZPSYNTH, type = rw, define = yes;
}
