# Memory layout of the soccer game on the Plus/4.
#
#   $0002-$00FF  zero page: all the game's - the KERNAL never runs (the
#                ROM is out, the interrupt is the game's own)
#   $0400-$0DFF  the figures' lists (engine.s): free once the program has
#                loaded, for the same reason
#   $0E00-$0FF7  more variables (play.s's LOWBSS), cleared at the start
#   $0FF8-$0FF9  a test's word to the title (title.s: SKIP)
#   $1001-$BFFF  the program
#   $C000-$C7FF  picture 0: colours ($C000), codes ($C400)
#   $C800-$CFFF  picture 0's characters
#   $D000-$D7FF  picture 1: colours, codes
#   $D800-$DFFF  picture 1's characters
#   $E000-$E6FF  each picture's cache: which code a ground character has
#                in it, and the codes given back (engine.s)
#   $E700-$E7FF  the figures' places on the ground (simple-soccer.s's
#                HIBSS2: not cleared, each worked out before it is read)
#   $E800-$EFFF  picture 2: colours, codes
#   $F000-$F7FF  picture 2's characters
#   $F800-$FBFF  the variables (BSS), cleared at the start: RAM with the
#                ROM out (not $FC00-$FCFF, to be safe)
#
#   The title (title.s) is loaded at $C000, where the pictures go once
#   the match is on: it runs first, on picture 2's place; the program is
#   filled up to it so the file is one piece - up to $D2FF at most: the
#   boot has put the flags at $D300 (build.sh checks). Its music (music.s)
#   makes its wave pages at $0400-$0DFF, and its interrupt goes into the
#   zero page above the game's (SYNTH, copied there).

FEATURES {
    STARTADDRESS: default = $1001;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $00FE;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $C000 - __HEADER_LAST__, fill = yes;
    TITLEMEM: file = %O,               start = $C000,           size = $2000;
    LOW:      file = "", define = yes, start = $0400,           size = $0A00;
    LOWV:     file = "", define = yes, start = $0E00,           size = $01F8;
    VARS:     file = "",               start = $F800,           size = $0400;
    HI:       file = "", define = yes, start = $E000,           size = $0800;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    FONTDATA: load = MAIN,     type = ro;
    TABLES:   load = MAIN,     type = ro;
    SQUARES:  load = MAIN,     type = ro, align = $100;
    DATA:     load = MAIN,     type = rw;
    BSS:      load = VARS,     type = bss, define = yes;
    LISTS:    load = LOW,      type = bss, align = $100;
    LOWBSS:   load = LOWV,     type = bss;
    HIBSS:    load = HI,       type = bss, define = yes, align = $100;
    HIBSS2:   load = HI,       type = bss;
    TITLE:    load = TITLEMEM, type = rw;
    SYNTH:    load = TITLEMEM, run = ZP, type = rw, define = yes;
}
