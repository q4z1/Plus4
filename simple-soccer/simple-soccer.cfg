# Memory layout of the soccer game on the Plus/4.
#
#   $0002-$00FF  zero page: all the game's - the KERNAL never runs (the
#                ROM is out, the interrupt is the game's own)
#   $0400-$0DFF  the figures' lists (engine.s): free once the program has
#                loaded, for the same reason
#   $0E00-$0FF7  more variables (play.s's LOWBSS), cleared at the start
#   $0FF8-$0FF9  a test's word to the title (title.s: SKIP)
#   $1001-$BFFF  the program
#   $C000-$C7FF  picture 0: colours ($C000), codes ($C400)
#   $C800-$CFFF  picture 0's characters
#   $D000-$D7FF  picture 1: colours, codes
#   $D800-$DFFF  picture 1's characters
#   $E000-$E6FF  each picture's cache: which code a ground character has
#                in it, and the codes given back (engine.s)
#   $E700-$E7FF  the figures' places on the ground (simple-soccer.s's
#                HIBSS2: not cleared, each worked out before it is read)
#   $E800-$EFFF  picture 2: colours, codes
#   $F000-$F7FF  picture 2's characters
#   $F800-$FBFF  the variables (BSS), cleared at the start: RAM with the
#                ROM out
#   $FC00-$FCFF  the formations the teams play (play.s FORMS: the title
#                copies them there), not cleared
#
#   $FCE0-$FCEF  what outlasts a match (game.inc K_VARS), and under the
#   $FF40-$FFF5  ROM's top resident.s's code and the league (resident.s)
#   $0200-$03FF  the fast loader, the KERNAL's way back (resident.s)
#
#   After a match cup.s comes from the disk, as two files of its own: the
#   loading screen, build/disk/cup.prg, to $E200 (CUP; CUPLD1-3), with a
#   little of it copied to $0400 (CUPLOW: kept), $05EC (LDBSS) and $0600
#   (LDLOW) and $F800 (LDHI: the loading and unpacking, over the match's
#   variables below its score); it brings the flags, the rest -
#   build/disk/pages.prg, the league's page and the winner's, from
#   CUP_MAIN on (CUPMEM), over CUPLD3 - and the title back, the three
#   packed (build.sh). Its variables then at $0680 (CUPBSS,
#   over LDLOW). The league's page's characters ($E200-$E31F) and the
#   winner's page, at $E340 (WIN, free while the title runs, for it) go
#   over CUPLD1 and 2 later.
#
#   The title (title.s) is loaded at $C000, where the pictures go once
#   the match is on: it runs first, on picture 2's place; the program is
#   filled up to it so the file is one piece - up to the flags at most,
#   which the boot has put just below $E200 (tools/mkflags.py's FLAGS;
#   build.sh checks). Its music (music.s)
#   makes its wave pages at $0400-$0DFF, and its interrupt goes into the
#   zero page above the game's (SYNTH, copied there). Once the title is
#   done, the match keeps its busiest variables there (MATCHZP, over
#   SYNTH: ZPM the same bytes as ZPS, and the 8 below them the game's
#   ZEROPAGE leaves; main clears them).

FEATURES {
    STARTADDRESS: default = $1001;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    CUP_AT:        type = weak, value = $E200;   # (game.inc CUP)
    CUP_MAIN:      type = weak, value = $E5D5;   # (past WIN's place and LDRUN: cup.s checks)
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $009E;
    ZPS:      file = "",               start = $00A8,           size = $0045;
    ZPM:      file = "",               start = $00A0,           size = $004D;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $C000 - __HEADER_LAST__, fill = yes;
    TITLEMEM: file = %O,               start = $C000,           size = $2000;
    LOW:      file = "", define = yes, start = $0400,           size = $0A00;
    LOWV:     file = "", define = yes, start = $0E00,           size = $01F8;
    VARS:     file = "",               start = $F800,           size = $0400;
    HI:       file = "", define = yes, start = $E000,           size = $0550;
    PAUSEM:   file = "",               start = $E550,           size = $01B0;   # (pause.s's page: loaded with the title, copied)
    HI2:      file = "",               start = $E700,           size = $0100;
    FORMSMEM: file = "",               start = $FC00,           size = $00E0;
    CUPHDR:   file = "build/disk/cup.prg", start = CUP_AT - 2,  size = $0002;
    CUPLD1:   file = "build/disk/cup.prg", start = CUP_AT,      size = $0090, fill = yes;
    CUPLD2:   file = "build/disk/cup.prg", start = CUP_AT + $90, size = CUP_MAIN - CUP_AT - $90, fill = yes;
    CUPLD3:   file = "build/disk/cup.prg", start = CUP_MAIN,    size = $0600;
    PGHDR:    file = "build/disk/pages.prg", start = CUP_MAIN - 2, size = $0002;
    CUPMEM:   file = "build/disk/pages.prg", start = CUP_MAIN,  size = $F800 - CUP_MAIN;
    CUPLOWM:  file = "",               start = $0400,           size = $00FC;
    LDBSSM:   file = "",               start = $05EC,           size = $0014;
    LDLOWM:   file = "",               start = $0600,           size = $01D8;   # (over CHECK, kstub: dead while it runs)
    CUPBSSM:  file = "",               start = $0680,           size = $0158;
    WINM:     file = "",               start = $E340,           size = $01C0;
    LDHIM:    file = "",               start = $F800,           size = $0200;   # (over the match's variables: cup.s)
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    FONTDATA: load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    KEEPTAB:  load = MAIN,     type = ro, start = $B200;  # (a page of its own: engine.s mblock)
    PAGES:    load = MAIN,     type = ro, start = $B300;  # (with TABLES up to SQUARES: MAIN's room all before)
    TABLES:   load = MAIN,     type = ro, align = $100;
    SQUARES:  load = MAIN,     type = ro, align = $100;
    BSS:      load = VARS,     type = bss, define = yes;
    LISTS:    load = LOW,      type = bss, align = $100;
    LOWBSS:   load = LOWV,     type = bss, define = yes;
    HIBSS:    load = HI,       type = bss, define = yes, align = $100;
    HIBSS2:   load = HI2,      type = bss, define = yes;
    FORMS:    load = FORMSMEM, type = bss;
    TITLE:    load = TITLEMEM, type = rw;
    SYNTH:    load = TITLEMEM, run = ZPS, type = rw, define = yes;
    PAUSEUI:  load = TITLEMEM, run = PAUSEM, type = rw, define = yes;
    MATCHZP:  load = ZPM,      type = zp, define = yes;  # (the match's, over SYNTH's)
    CUPHDR:   load = CUPHDR,   type = ro;
    CUPPRE:   load = CUPLD1,   type = rw;
    LDRUN:    load = CUPLD2,   type = rw, define = yes;
    CUPLOW:   load = CUPLD3,   run = CUPLOWM, type = rw, define = yes;
    LDLOW:    load = CUPLD3,   run = LDLOWM,  type = rw, define = yes;
    LDHI:     load = CUPLD3,   run = LDHIM,   type = rw, define = yes;
    LDBSS:    load = LDBSSM,   type = bss;
    CUPPGHDR: load = PGHDR,    type = ro;
    CUP:      load = CUPMEM,   type = rw, define = yes;
    CUPBSS:   load = CUPBSSM,  type = bss, define = yes;   # (over LDLOW: cleared after it)
    WIN:      load = CUPMEM,   run = WINM,    type = rw, define = yes;  # (cup.s: in the title)
}
