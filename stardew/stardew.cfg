# Memory layout of Stardew Pond on the Plus/4.
#
#   $0002-$001B  cc65's own zero page
#   $001C-$007F  zero page of the engine
#   $0800-$0DFF  the game state, everything a save file holds. It has to
#                be below $8000: the KERNAL saves with the ROM switched in,
#                and would save the ROM instead of what is under it.
#   $0E00-$0FFF  engine lists (engine.s LOWBSS)
#   $1001-$BFFF  program, then the engine's tables
#   $C000-$CFFF  two map character sets, one per picture (engine.s)
#   $D000-$DFFF  two colour and screen matrices, one per picture
#   $E000-$E7FF  the toolbar's character set, loaded from disk
#   $E800-$EFFF  the map image: the screen without figures (engine.s);
#                in the test build also where its menu is loaded
#   $F000-$F1FF  the figures' columns and a table (engine.s)
#   $F200-$F77F  the room and its tile set's tables
#   $F780-$FAFF  the rooms, packed, as they came off the disk (world.c)
#   $FB00-$FCFF  cc65's stack (set in main()): with static locals (-Cl)
#                it is never more than a few dozen bytes deep

FEATURES {
    STARTADDRESS: default = $1001;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0200;
    __HIMEM__:     type = weak, value = $FD00;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    ZPENG:    file = "", define = yes, start = $001C,           size = $0064;
    SAVE:     file = "", define = yes, start = $0800,           size = $0600;
    LOWRAM:   file = "", define = yes, start = $0E00,           size = $0200;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $C000 - __HEADER_LAST__;
    IMG:      file = "", define = yes, start = $E800,           size = $0800;
    HITAB:    file = "", define = yes, start = $F000,           size = $0200;
    # the test build's menu (testmenu.c), loaded from disk over the map
    # image, which is drawn afresh when it is done
    TESTOVL:  file = "build/testmenu.bin", define = yes, start = $E800, size = $0800;
    HIRAM:    file = "", define = yes, start = $F200,           size = $0580;
    ROOMS:    file = "", define = yes, start = $F780,           size = $0380;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    ENGZP:    load = ZPENG,    type = zp;
    SAVEDATA: load = SAVE,     type = bss, define = yes;
    LOWBSS:   load = LOWRAM,   type = bss;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    ONCE:     load = MAIN,     type = ro,  optional = yes;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = bss;
    BSS:      load = MAIN,     type = bss, define   = yes;
    MAPIMG:   load = IMG,      type = bss;
    HITABLES: load = HITAB,    type = bss;
    TESTMENU: load = TESTOVL,  type = rw,  define = yes;
    TABLES:   load = MAIN,     type = bss, align    = $100;
    HIBSS:    load = HIRAM,    type = bss, define   = yes, optional = yes;
    ROOMPOOL: load = ROOMS,    type = bss;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
