# Memory layout of trainschedule on the Plus/4.
#
#   $0002-$001B  cc65's zero page: its start-up's, and ptr1-ptr4, which
#                engine.s uses
#   $001C-$003B  engine.s's (the KERNAL does not run in the game)
#   $003C-$007F  the game's (BASIC's, which does not run either; the
#                KERNAL's loading keeps to $90 on)
#   $0400-$07FF  routes set (route.s): the game never calls the KERNAL, so
#                its work area is free, as in Paradroid
#   $0800-$0FFF  colours and characters of the screen
#   $1001-$AFFF  the program
#   $B000-$B5FF  the map's song, from its file (front.s; game.inc SONG_BUF)
#   $B600-$B7FF  the bands of set switches (map.s, engine.s): where the TED
#                fetches colours twice in a character row
#   $B800-$BFFF  a copy of the character set, shown while the zoom changes
#                and the characters are made afresh (engine.s, eng_font2)
#   $C000-$C7FF  the character set (game.inc: font, track, cursor, trains)
#   $C800-$D9FF  the map: characters, colours, who holds each cell (map.s),
#                1536 cells each
#   $DA00-$DFFF  the map file as loaded (front.s), the kinds of cell
#                (map.s)
#   $E000-$E7FF  the trains' rings (train.s)
#   $E800-$EBFF  tables of the route search (route.s), and room
#   $EC00-$EFFF  the trains' draw list (engine.s), part 1
#   $F000-$F7FF  the second screen: colours, characters
#   $F800-$F9FF  the trains' draw list, part 2
#   $FA00-$FAFF  the fast loader (fastload.s, put there by boot.s)
#   $FB00-$FC3F  small variables (segment STKBSS): the music's, the map
#                list's, the map's rows, the gaps between a train's cars
#   $FC40-$FCFF  free: no C, no C stack. cc65's start-up pushes main()'s
#                arguments, 4 bytes, below $FD00 (__STACKSIZE__ puts its
#                stack pointer there, not into the character set)

FEATURES {
    STARTADDRESS: default = $1001;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $3D00;   # $C000 + this: $FD00
    __HIMEM__:     type = weak, value = $FD00;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    ZPENG:    file = "", define = yes, start = $001C,           size = $0020;
    ZPGAME:   file = "", define = yes, start = $003C,           size = $0044;
    LOW:      file = "", define = yes, start = $0400,           size = $0400;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $B000 - __HEADER_LAST__;
    SNG:      file = "", define = yes, start = $B000,           size = $0600;
    BND:      file = "", define = yes, start = $B600,           size = $0200;
    FNT2:     file = "", define = yes, start = $B800,           size = $0800;
    HIM:      file = "", define = yes, start = $DA00,           size = $0600;
    HI0:      file = "", define = yes, start = $E000,           size = $0800;
    HI3:      file = "", define = yes, start = $E800,           size = $0400;
    HI1:      file = "", define = yes, start = $EC00,           size = $0400;
    HI2:      file = "", define = yes, start = $F800,           size = $0300;
    STK:      file = "", define = yes, start = $FB00,           size = $0140;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    ENGZP:    load = ZPENG,    type = zp;
    GAMEZP:   load = ZPGAME,   type = zp;
    LOWBSS:   load = LOW,      type = bss;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    LOWDATA:  load = MAIN,     type = rw,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    ONCE:     load = MAIN,     type = ro,  optional = yes;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = bss;
    BSS:      load = MAIN,     type = bss, define   = yes;
    RINGS:    load = HI0,      type = bss;
    SONGBUF:  load = SNG,      type = bss;
    BANDS:    load = BND,      type = bss;
    FONT2:    load = FNT2,     type = bss;
    MAPHI:    load = HIM,      type = bss;
    HIBSS:    load = HI3,      type = bss;
    DLIST1:   load = HI1,      type = bss, align    = $100;
    DLIST2:   load = HI2,      type = bss, align    = $100;
    STKBSS:   load = STK,      type = bss;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
