# Memory layout of trainschedule on the Plus/4.
#
#   $0002-$001B  cc65's zero page: its start-up's, and ptr1-ptr4, which
#                engine.s uses
#   $001C-$003B  engine.s's (the KERNAL does not run in the game)
#   $003C-$007F  the game's (BASIC's, which does not run either; the
#                KERNAL's loading keeps to $90 on)
#   $0333-$03F2  the best scores (scores.s, game.inc BEST): the cassette
#                buffer - no tape in the game
#   $0400-$07FF  routes set (route.s): the game never calls the KERNAL, so
#                its work area is free, as in Paradroid. When the best
#                scores are saved (no level then), the KERNAL's way runs
#                from $0400 (KSAVE), and with the fast loader they are
#                read back to $0500.
#   $0800-$0FFF  colours and characters of the screen
#   $1001-$AFFF  the program
#   $B000-$B55F  the map's song, from its file (front.s; game.inc SONG_BUF)
#   $B560-$B7FF  the bands of set switches (map.s, engine.s): where the TED
#                fetches colours twice in a character row - from $B740 the
#                overview's writes for it, made as code in each blank
#   $B800-$BFFF  a copy of the character set, shown while the zoom changes
#                and the characters are made afresh (engine.s, eng_font2)
#   $B000-$BFFF  outside a level, all of it: the choice of a map and the
#                page of help (front.s, help.s) - an overlay, a file of its
#                own, build/help.bin, loaded before the choice
#   $E300-$E6FF  outside a level: the best scores' code (scores.s), in
#                the catalogue's file, after the catalogue (front.s, at
#                $E000); build/scores.bin
#   $E700-$E7FF  outside a level: the overlay's variables, behind them
#   $C000-$C7FF  the character set (game.inc: font, track, cursor, trains);
#                after a level, for the page of its best scores, their code
#                (scores.s, SCPAGE: the file "scores", build/page.bin)
#   $C800-$D3FF  the map: characters, colours, who holds each cell (map.s),
#                1024 cells each (game.inc MAP_MAX)
#   $D400-$D9FF  tables made afresh before they are read (segment XBSS):
#                the kinds of cell's quarters' colours, multicolour, plain
#                track (map.s), the trains' free characters, those given
#                up, the bytes of a cell a half track touches (engine.s,
#                train.s)
#   $DA00-$DFFF  the map file as loaded (front.s), the kinds of cell
#                (map.s)
#   $E000-$E7FF  the trains' rings (train.s)
#   $E800-$EBFF  tables of the route search (route.s), and room
#   $EC00-$EFFF  the trains' draw list (engine.s), part 1
#   $F000-$F7FF  the second screen: colours, characters
#   $F800-$F9FF  the trains' draw list, part 2
#   $FA00-$FAFF  the fast loader (fastload.s, put there by boot.s)
#   $FB00-$FCFB  small variables (segment STKBSS): the music's, the map
#                list's, the map's rows, the gaps between a train's cars,
#                text lines - none of them cleared at the start: no C, no
#                C stack (the start is the game's own, trainschedule.s:
#                only BSS is cleared)
#   $FF40-$FFF9  the trains' variables (train.s, segment TOPBSS): RAM only
#                while the ROM is out - as it always is in the game; cleared
#                at the start, as BSS

FEATURES {
    STARTADDRESS: default = $1001;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    ZPENG:    file = "", define = yes, start = $001C,           size = $0020;
    ZPGAME:   file = "", define = yes, start = $003C,           size = $0044;
    LOW:      file = "", define = yes, start = $0400,           size = $0400;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $B000 - __HEADER_LAST__;
    SNG:      file = "", define = yes, start = $B000,           size = $0560;
    BND:      file = "", define = yes, start = $B560,           size = $01E0;
    FWR:      file = "", define = yes, start = $B740,           size = $00C0;
    FNT2:     file = "", define = yes, start = $B800,           size = $0800;
    XB:       file = "", define = yes, start = $D400,           size = $0600;
    HIM:      file = "", define = yes, start = $DA00,           size = $0600;
    HI0:      file = "", define = yes, start = $E000,           size = $0800;
    HI3:      file = "", define = yes, start = $E800,           size = $0400;
    HI1:      file = "", define = yes, start = $EC00,           size = $0400;
    HI2:      file = "", define = yes, start = $F800,           size = $0300;
    STK:      file = "", define = yes, start = $FB00,           size = $01FC;
    TOP:      file = "", define = yes, start = $FF40,           size = $00BA;
    OVL:      file = "build/help.bin", define = yes, start = $B000, size = $1000;
    OVLB:     file = "", define = yes, start = $E700,           size = $0100;
    SCO:      file = "build/scores.bin", define = yes, start = $E300, size = $0400;
    SCP:      file = "build/page.bin", define = yes, start = $C000, size = $0800;
    KSV:      file = "", define = yes, start = $0400,           size = $0100;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    ENGZP:    load = ZPENG,    type = zp;
    GAMEZP:   load = ZPGAME,   type = zp;
    LOWBSS:   load = LOW,      type = bss;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    LOWDATA:  load = MAIN,     type = rw,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    ONCE:     load = MAIN,     type = ro,  optional = yes;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    BSS:      load = MAIN,     type = bss, define   = yes;
    RINGS:    load = HI0,      type = bss;
    SONGBUF:  load = SNG,      type = bss;
    BANDS:    load = BND,      type = bss;
    FWRITE:   load = FWR,      type = bss;
    FONT2:    load = FNT2,     type = bss;
    XBSS:     load = XB,       type = bss;
    MAPHI:    load = HIM,      type = bss;
    HIBSS:    load = HI3,      type = bss;
    DLIST1:   load = HI1,      type = bss, align    = $100;
    DLIST2:   load = HI2,      type = bss, align    = $100;
    STKBSS:   load = STK,      type = bss;
    TOPBSS:   load = TOP,      type = bss, define   = yes;
    OVLCODE:  load = OVL,      type = rw;
    OVLDATA:  load = OVL,      type = rw;
    OVLBSS:   load = OVLB,     type = bss;
    SCORES:   load = SCO,      type = rw;
    SCPAGE:   load = SCP,      type = rw;
    KSAVE:    load = SCP, run = KSV, type = rw, define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}
