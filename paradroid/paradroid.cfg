# Memory layout of Paradroid on the Plus/4.
#
#   $0002-$001B  cc65's own zero page
#   $001C-$00FF  zero page of the engine
#   $0400-$07FF  the deck: 64 x 16 blocks
#   $0800-$0C67  the deck characters in multicolour
#   $0C68-$0FFF  the engine's lists of cells handed characters
#   $1001-$BFFF  program, then the engine's tables; the overlays title.c
#                and console.c run in the picture slots ($1400 into them)
#   $C000-$C7FF  picture 0: colours, codes          } the order matters,
#   $C800-$CFFF  its character set                  } see engine.s
#   $D000-$D7FF  picture 1
#   $D800-$DFFF  its character set
#   $E000-$E7FF  the status panel's character set
#   $E800-$EFFF  block characters and their colours, [4][256] each
#   $F000-$FBFF  the engine's tables
#   $FC00-$FCFF  cc65's stack (set in main(); locals are static, -Cl)

FEATURES {
    STARTADDRESS: default = $1001;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0500;
    __HIMEM__:     type = weak, value = $FD00;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    ZPENG:    file = "", define = yes, start = $001C,           size = $00E4;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $C000 - __HEADER_LAST__;
    HIRAM:    file = "", define = yes, start = $F000,           size = $0C00;
    LOWRAM:   file = "", define = yes, start = $0C68,           size = $0398;
    OVLHDR:   file = "build/title.bin", start = __INITDATA_RUN__ + $13FE, size = $0002;
    OVL:      file = "build/title.bin", define = yes, start = __INITDATA_RUN__ + $1400, size = $1A00;
    CONHDR:   file = "build/console.bin", start = __INITDATA_RUN__ + $13FE, size = $0002;
    CON:      file = "build/console.bin", start = __INITDATA_RUN__ + $1400, size = $1A00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    ENGZP:    load = ZPENG,    type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    ONCE:     load = MAIN,     type = ro,  optional = yes;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INITDATA: load = MAIN,     type = rw,  define   = yes;
    PREBSS:   load = MAIN,     type = bss;
    INIT:     load = MAIN,     type = bss;
    BSS:      load = MAIN,     type = bss, define   = yes;
    TABLES:   load = HIRAM,    type = bss, align    = $100;
    LOWBSS:   load = LOWRAM,   type = bss;
    OVLHDR:   load = OVLHDR,   type = ro;
    OVLCODE:  load = OVL,      type = ro;
    OVLDATA:  load = OVL,      type = ro;
    CONHDR:   load = CONHDR,   type = ro;
    CONCODE:  load = CON,      type = ro;
    CONDATA:  load = CON,      type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
