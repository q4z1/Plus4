# Memory layout of Paradroid on the Plus/4.
#
#   $0002-$001B  cc65's own zero page
#   $001C-$00FF  zero page of the engine
#   $0100-$01BF  which droids the player sees (sight.s), copied there at
#                the start, under the processor's stack
#   $0200-$03FF  the unpacker (unpack.s), copied there at the start
#   $0400-$07FF  the deck: 64 x 16 blocks
#   $0800-$0C67  the deck characters in multicolour
#   $0C68-$0FFF  the engine's lists of cells handed characters
#   $1001-$BFFF  program, then the engine's tables, then what is kept
#                packed (BLOBS); the title's overlay (title.s) runs in the
#                picture slots, and so do the console's and lift's
#                (screens.s) and the transfer's (transfer.s, xfer.s),
#                unpacked there; the transfer's leaves the last two slots
#                to the droids on its board
#   $C000-$C7FF  picture 0: colours, codes          } the order matters,
#   $C800-$CFFF  its character set                  } see engine.s
#   $D000-$D7FF  picture 1
#   $D800-$DFFF  its character set
#   $E000-$E7FF  the status panel's character set
#   $E800-$EFFF  block characters and their colours, [4][256] each; in
#                the colours' free ends (160 on) tables copied there at
#                the start (X1-X4)
#   $F000-$F2FF  the engine's tables
#   $F300-$FBFF  the figures, the window and the panel (figs.s, draw.s),
#                copied there at the start
#   $FC00-$FCEF  the sound effects' player (sfx.s), a few words and
#                player_spot() (paradroid.s, move.s), copied there at the
#                start
#   $FCF0-$FCFF  cc65's stack (set in main(); the few C-style calls left
#                need a few bytes: 2 measured)
#   $FF40-$FFF9  tables copied there at the start (X5)

FEATURES {
    STARTADDRESS: default = $1001;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0500;
    __HIMEM__:     type = weak, value = $FD00;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    ZPENG:    file = "", define = yes, start = $001C,           size = $00E4;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $C000 - __HEADER_LAST__;
    HIRAM:    file = "", define = yes, start = $F000,           size = $0300;
    HIRUN:    file = "", define = yes, start = $F300,           size = $0900;
    LOWRAM:   file = "", define = yes, start = $0C68,           size = $0398;
    SFXRUN:   file = "", define = yes, start = $FC00,           size = $00F0;
    UNPRUN:   file = "", define = yes, start = $0200,           size = $0200;
    # under the processor's stack, which reaches $01D8 at its deepest
    PG1RUN:   file = "", define = yes, start = $0100,           size = $00C0;
    # the free ends of the block colour table, and above the TED (mkdata.py)
    X1:       file = "", define = yes, start = $ECA0,           size = $0060;
    X2:       file = "", define = yes, start = $EDA0,           size = $0060;
    X3:       file = "", define = yes, start = $EEA0,           size = $0060;
    X4:       file = "", define = yes, start = $EFA0,           size = $0060;
    X5:       file = "", define = yes, start = $FF40,           size = $00BA;
    OVL:      file = "build/title.bin", define = yes, start = __INITDATA_RUN__, size = $2E00;
    CONOVL:   file = "build/con.bin",   define = yes, start = __INITDATA_RUN__, size = $2E00;
    XFEROVL:  file = "build/xfer.bin",  define = yes, start = __INITDATA_RUN__, size = $2A00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    ENGZP:    load = ZPENG,    type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    ONCE:     load = MAIN,     type = ro,  optional = yes;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INITDATA: load = MAIN,     type = rw,  define   = yes;
    INITCODE: load = MAIN,     type = rw;    # (after it: the slots start at pre)
    SFXCODE:  load = MAIN, run = SFXRUN, type = rw, define = yes;
    UNPACK:   load = MAIN, run = UNPRUN, type = rw, define = yes;
    PAGE1:    load = MAIN, run = PG1RUN, type = rw, define = yes;
    XT1:      load = MAIN, run = X1, type = rw, define = yes;
    XT2:      load = MAIN, run = X2, type = rw, define = yes;
    XT3:      load = MAIN, run = X3, type = rw, define = yes;
    XT4:      load = MAIN, run = X4, type = rw, define = yes;
    XT5:      load = MAIN, run = X5, type = rw, define = yes;
    HICODE:   load = MAIN, run = HIRUN,  type = rw, define = yes;
    # (written to the file, as zeros, so that BLOBS after them lands where
    # it is linked for; it is last, so that nothing moves with it:
    # build.sh)
    PREBSS:   load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    BSS:      load = MAIN,     type = rw,  define   = yes;
    BLOBS:    load = MAIN,     type = ro,  optional = yes;
    TABLES:   load = HIRAM,    type = bss, align    = $100;
    LOWBSS:   load = LOWRAM,   type = bss;
    # (LOWRAM's end, after LOWBSS: a little code, copied there at the start)
    LOWEND:   load = MAIN, run = LOWRAM, type = rw, define = yes;
    OVLCODE:  load = OVL,      type = ro;
    OVLDATA:  load = OVL,      type = ro;
    CONCODE:  load = CONOVL,   type = ro;
    CONDATA:  load = CONOVL,   type = ro;
    XFERCODE: load = XFEROVL,  type = ro;
    XFERDATA: load = XFEROVL,  type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
