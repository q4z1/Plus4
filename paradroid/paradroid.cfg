# Memory layout of Paradroid on the Plus/4.
#
#   $0002-$001B  cc65's own zero page
#   $001C-$00FF  zero page of the engine
#   $0200-$03FF  the unpacker (unpack.s), copied there at the start
#   $0400-$07FF  the deck: 64 x 16 blocks
#   $0800-$0C67  the deck characters in multicolour
#   $0C68-$0FFF  the engine's lists of cells handed characters
#   $1001-$BE9F  program, then the engine's tables, then what is kept
#                packed (BLOBS); the title's overlay (title.c) runs in the
#                picture slots, and so do the console's and lift's
#                (console.c, lift.c) and the transfer's (transfer.c, xfer.s),
#                unpacked there; the transfer's leaves the last two slots
#                to the droids on its board
#   $BEA0-$BFFF  the fast loader for the drive found (fastload51.s or
#                fastload41.s), copied there at the start
#   $C000-$C7FF  picture 0: colours, codes          } the order matters,
#   $C800-$CFFF  its character set                  } see engine.s
#   $D000-$D7FF  picture 1
#   $D800-$DFFF  its character set
#   $E000-$E7FF  the status panel's character set
#   $E800-$EFFF  block characters and their colours, [4][256] each
#   $F000-$F3FF  the engine's tables
#   $F400-$FBFF  the figures (figs.s), copied there at the start
#   $FC00-$FCBF  the sound effects' player (sfx.s), copied there at the start
#   $FCC0-$FCFF  cc65's stack (set in main(); locals are static, -Cl: it
#                needs a few dozen bytes)

FEATURES {
    STARTADDRESS: default = $1001;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0500;
    __HIMEM__:     type = weak, value = $FD00;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    ZPENG:    file = "", define = yes, start = $001C,           size = $00E4;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $BEA0 - __HEADER_LAST__;
    FLRUN51:  file = "", define = yes, start = $BEA0,           size = $0160;
    FLRUN41:  file = "", define = yes, start = $BEA0,           size = $0160;
    HIRAM:    file = "", define = yes, start = $F000,           size = $0400;
    HIRUN:    file = "", define = yes, start = $F400,           size = $0800;
    LOWRAM:   file = "", define = yes, start = $0C68,           size = $0398;
    SFXRUN:   file = "", define = yes, start = $FC00,           size = $00C0;
    UNPRUN:   file = "", define = yes, start = $0200,           size = $0200;
    OVL:      file = "build/title.bin", define = yes, start = __INITDATA_RUN__, size = $2E00;
    CONOVL:   file = "build/con.bin",   define = yes, start = __INITDATA_RUN__, size = $2E00;
    XFEROVL:  file = "build/xfer.bin",  define = yes, start = __INITDATA_RUN__, size = $2A00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    ENGZP:    load = ZPENG,    type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    ONCE:     load = MAIN,     type = ro,  optional = yes;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INITDATA: load = MAIN,     type = rw,  define   = yes;
    INITCODE: load = MAIN,     type = rw;    # (after it: the slots start at pre)
    SFXCODE:  load = MAIN, run = SFXRUN, type = rw, define = yes;
    UNPACK:   load = MAIN, run = UNPRUN, type = rw, define = yes;
    HICODE:   load = MAIN, run = HIRUN,  type = rw, define = yes;
    FL51:     load = MAIN, run = FLRUN51, type = rw, define = yes;
    FL41:     load = MAIN, run = FLRUN41, type = rw, define = yes;
    # (written to the file, as zeros, so that BLOBS after them lands where
    # it is linked for; it is last, so that nothing moves with it:
    # build.sh)
    PREBSS:   load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    BSS:      load = MAIN,     type = rw,  define   = yes;
    BLOBS:    load = MAIN,     type = ro,  optional = yes;
    TABLES:   load = HIRAM,    type = bss, align    = $100;
    LOWBSS:   load = LOWRAM,   type = bss;
    OVLCODE:  load = OVL,      type = ro;
    OVLDATA:  load = OVL,      type = ro;
    CONCODE:  load = CONOVL,   type = ro;
    CONDATA:  load = CONOVL,   type = ro;
    XFERCODE: load = XFEROVL,  type = ro;
    XFERDATA: load = XFEROVL,  type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
